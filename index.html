<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>İş-elanı-365gun</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f9f9f9; margin: 0; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; }
        .hero-banner { width: 100%; height: 250px; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1521737711867-e3b97375f902?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80'); background-size: cover; background-position: center; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        h1 { font-size: 3rem; margin: 20px 0; color: #333; }
        .category-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px; max-width: 800px; }
        .category-btn { background: #fff; border: 1px solid #ddd; padding: 12px 25px; border-radius: 25px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .category-btn:hover { background: #1a73e8; color: white; }
        .payment-box, .complaint-box { background: #fff; padding: 25px; border-radius: 12px; border: 2px solid #34A853; margin: 15px; text-align: center; width: 320px; }
        .complaint-box { border: 2px solid #e74c3c; }
        #adminPanel { display: none; background: #333; color: white; padding: 20px; width: 90%; max-width: 600px; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="hero-banner">
    <h1>İş-elanı-365gun</h1>
    <p>Xəyallarınızdakı iş bir addımlıqdadır!</p>
</div>

<div class="category-grid">
    <button class="category-btn">Fəhlə</button>
    <button class="category-btn">İşçi</button>
    <button class="category-btn">Kuryer</button>
    <button class="category-btn">Təmizlikçi</button>
    <button class="category-btn">Bağban</button>
    <button class="category-btn">Usta</button>
    <button class="category-btn">Sürücü</button>
    <button class="category-btn">Satıcı</button>
</div>

<div class="payment-box">
    <h3 style="color: #34A853; margin-top:0;">Premium Ödəniş</h3>
    <p style="font-weight: bold; font-size: 1.2rem;">4169 7388 0542 1389</p>
    <p style="font-size: 12px; color: #666;">Nuray - Kapital Bank</p>
    <input type="file" accept="image/*">
</div>

<div class="complaint-box">
    <h3 style="color: #e74c3c; margin-top:0;">Şikayət və Təklif</h3>
    <textarea id="complaintText" style="width:100%; height:80px;"></textarea>
    <button onclick="saveComplaint()" style="background:#e74c3c; color:white; border:none; padding:10px; width:100%; margin-top:10px;">Göndər</button>
</div>

<div style="margin: 40px;">
    <button onclick="loginAdmin()" style="background:none; border:none; color:gray; cursor:pointer;">Adminə giriş</button>
</div>

<div id="adminPanel">
    <h2>Admin Paneli</h2>
    <div id="adminContent">
        <p>Bura şikayətlər düşəcək:</p>
        <ul id="complaintList"></ul>
    </div>
</div>

<script>
    function saveComplaint() {
        let text = document.getElementById('complaintText').value;
        localStorage.setItem('lastComplaint', text);
        alert('Mesajınız adminə göndərildi!');
        document.getElementById('complaintText').value = '';
    }

    function loginAdmin() {
        let username = prompt("İstifadəçi adınızı (nik) daxil edin:");
        let password = prompt("Şifrəni daxil et:");

        if (username === "Sem666" && password === "0554289090Samir") {
            document.getElementById('adminPanel').style.display = 'block';
            let list = document.getElementById('complaintList');
            let complaint = localStorage.getItem('lastComplaint');
            list.innerHTML = "<li>" + (complaint ? complaint : "Hələlik şikayət yoxdur") + "</li>";
        } else {
            alert("İstifadəçi adı və ya şifrə yanlışdır!");
        }
    }
</script>

</body>
</html>
